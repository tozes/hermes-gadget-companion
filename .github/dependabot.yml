# Weekly update PRs for the workflows' actions. Updates wait a week after release before
# they're proposed, so a release that gets pulled never reaches a PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
