name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entry
    # Every pull request adds a line to CHANGELOG.md's Unreleased section, or carries the
    # no-changelog label (internal refactors, test-only fixes, dependency bumps).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Labels are read live, not from the event, so adding no-changelog and re-running the job works.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qx no-changelog; then
            echo "no-changelog label: skipped"; exit 0
          fi
          if git diff --name-only "$BASE...HEAD" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md is updated"
          else
            echo "::error file=CHANGELOG.md::Add a line under '## Unreleased' in CHANGELOG.md, or label the PR no-changelog"
            exit 1
          fi

  tests-linux:
    name: GadgetKit tests (Linux)
    # The app's logic (GadgetKit) needs only Foundation, so it builds and tests on Linux,
    # the same way contributors without a Mac run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Test
        run: swift test --package-path GadgetKit --parallel

  ios:
    name: iOS app and tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test GadgetKit on macOS
        run: swift test --package-path GadgetKit --parallel
      - name: Build the app for iOS
        # Compiles every SwiftUI and Core Bluetooth source for a device, unsigned. Signing and
        # installing happen on a contributor's machine (xtool dev, or Xcode).
        run: |
          xcodebuild build \
            -scheme HermesCompanion \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
