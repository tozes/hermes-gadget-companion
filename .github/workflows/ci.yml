name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entry
    # Every pull request adds a line to CHANGELOG.md's Unreleased section, or carries the
    # no-changelog label (internal refactors, test-only fixes, dependency bumps).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Labels are read live, not from the event, so adding no-changelog and re-running the job works.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qx no-changelog; then
            echo "no-changelog label: skipped"; exit 0
          fi
          if git diff --name-only "$BASE...HEAD" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md is updated"
          else
            echo "::error file=CHANGELOG.md::Add a line under '## Unreleased' in CHANGELOG.md, or label the PR no-changelog"
            exit 1
          fi

  tests-linux:
    name: GadgetKit tests (Linux)
    # The app's logic (GadgetKit) needs only Foundation, so it builds and tests on Linux,
    # the same way contributors without a Mac run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Test
        working-directory: ios
        run: swift test --package-path GadgetKit --parallel

  android:
    name: Android app and tests
    # The Kotlin port of GadgetKit (android/core) is tested on the JVM against the same
    # fixtures as the Swift tests; the app is built and linted. Nothing here needs a phone,
    # and no secret: the APK is a debug build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Also checks that gradle/wrapper/gradle-wrapper.jar is a genuine Gradle release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      - name: Test, build and lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hermes-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/
          if-no-files-found: ignore

  ios:
    name: iOS app and tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test GadgetKit on macOS
        working-directory: ios
        run: swift test --package-path GadgetKit --parallel
      - name: Build the app for iOS
        working-directory: ios
        # Compiles every SwiftUI and Core Bluetooth source for a device, unsigned. Signing and
        # installing happen on a contributor's machine (xtool dev, or Xcode).
        run: |
          xcodebuild build \
            -scheme HermesCompanion \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
